name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  common-setup:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Cache pip (cache key generation)
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  setup:
    needs: common-setup
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  lint:
    needs: common-setup
    runs-on: ubuntu-latest
    steps:
      - name: Lint with pylint
        run: pylint **/*.py

  test:
    needs: common-setup
    runs-on: ubuntu-latest
    steps:
      - name: Run unit tests with coverage
        run: pytest --cov=./ --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t myapp .
      - name: Test Docker image
        run: |
          docker run -d -p 5000:5000 --env-file .env --name myapp_container myapp
          timeout 30s bash -c "until curl -f http://localhost:5000/version; do sleep 1; done"
          curl -f http://localhost:5000/version || exit 1
      - name: Clean up Docker
        if: always()
        run: |
          docker stop myapp_container
          docker rm myapp_container

  integration_test:
    needs: common-setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run integration tests
        run: pytest test_integration.py

  sonarqube:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository }}
            -Dsonar.python.version=3.13
            -Dsonar.python.coverage.reportPaths=coverage.xml
