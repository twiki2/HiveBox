name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [ master ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
