name: CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{secrets.MY_PAT}}

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with pylint
        run: |
          pip install pylint
          pylint main.py test_main.py

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Run unit tests
        run: pytest
      - name: OSSF Scorecard action
        uses: ossf/scorecard-action@v2.4.1

      - name: Build Docker image
        run: docker build -t myapp .

      - name: Run Docker container
        run: docker run -d -p 5000:5000 --name myapp_container myapp

      - name: Wait for container to start
        run: sleep 5

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Check /version endpoint
        run: |
          for i in {1..10}; do
            response=$(curl -s http://127.0.0.1:5000/version)
            if [ -n "$response" ]; then
              echo "Service is up!"
              break
            fi
            echo "Waiting for container to start..."
            sleep 2
          done
          version=$(echo $response | jq -r '.version')
          if [ "$version" != "0.3.1" ]; then
            echo "Version mismatch: expected 0.3.1, got $version"
          exit 1
          fi



